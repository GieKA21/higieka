<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran KKN</title>
<meta name="description" content="Pendaftaran KKN UIN Alauddin Makassar dilakukan melalui sistem resmi.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13261F">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --malam:#13261F; --kertas:#F2F4EF; --muka:#FFFFFF; --garis:#D9DED8;
  --tinta:#18231F; --tinta-2:#3A4842;
  --daun:#1F7A4D; --daun-tua:#155E3A; --nila:#2E4A86;
  --huruf:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--kertas);color:var(--tinta);font-family:var(--huruf);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--nila);outline-offset:2px}
h1,p{margin:0}
a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pita{background:var(--malam);color:#D6E4DB}
.pita-dalam{max-width:680px;margin:0 auto;padding:20px 16px 30px;display:flex;flex-direction:column;gap:6px}
.pita a{color:#A9C2B5;font-size:14px;font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
.pita a:hover{color:#fff}
.pita :focus-visible{outline-color:#fff}
.pita h1{color:#fff;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
.bagian{background:var(--muka);border:1px solid var(--garis);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.bagian p{color:var(--tinta-2)}
.tombol{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:999px;background:var(--daun);color:#fff;font-weight:700;text-decoration:none}
.tombol:hover{background:var(--daun-tua)}
</style>
</head>
<body>
<header class="pita">
  <div class="pita-dalam">
    <a href="/kkn/">Dashboard KKN</a>
    <h1>Pendaftaran KKN</h1>
  </div>
</header>
<main>
  <section class="bagian">
    <p>Pendaftaran KKN UIN Alauddin Makassar dilakukan melalui sistem resmi LP2M. Formulir uji coba yang sebelumnya ada di halaman ini sudah tidak dipakai.</p>
    <a class="tombol" href="https://kkn.uin-alauddin.ac.id/">Buka pendaftaran resmi</a>
  </section>
</main>
</body>
</html>
