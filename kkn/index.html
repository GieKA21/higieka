<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin LKH KKN</title>
<meta name="description" content="Rancangan dashboard admin LKH KKN: pendaftar, impor data, dan penempatan peserta.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13261F">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --malam:#13261F; --malam-2:#1D3A2F; --kertas:#F2F4EF; --muka:#FFFFFF; --alas:#E7EBE5; --sela:#F7F8F5;
  --garis:#D9DED8; --garis-tegas:#A3AFA8;
  --tinta:#18231F; --tinta-2:#3A4842; --batu:#56655E;
  --daun:#1F7A4D; --daun-tua:#155E3A; --daun-muda:#E3F1E8;
  --padi:#E9B949; --padi-muda:#FBF1D6;
  --bata:#B4432E; --bata-tua:#8E2F1E; --bata-muda:#F9E4DF;
  --nila:#2E4A86; --nila-muda:#E5ECF8;
  --huruf:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--kertas);color:var(--tinta);font-family:var(--huruf);font-size:15px;line-height:1.5;accent-color:var(--daun);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--nila);outline-offset:2px}
a{color:var(--daun-tua)}
h1,h2,h3,p{margin:0}
.lompat{position:absolute;left:12px;top:-60px;z-index:30;padding:10px 14px;border-radius:10px;background:#fff;color:var(--malam);font-weight:700}
.lompat:focus{top:12px}
button,a,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.kecil{font-size:12.5px;color:var(--batu)}
.angka-rata{font-variant-numeric:tabular-nums}
.tebal{font-weight:600}

/* Pita atas: merek, tautan, dan garis 45 hari yang tumbuh seperti batang padi. */
.app{min-height:100vh;display:flex;flex-direction:column}
.puncak{background:var(--malam);color:#D6E4DB}
.puncak-dalam{max-width:1240px;margin:0 auto;padding:18px 32px 22px;display:flex;flex-direction:column;gap:18px}
.puncak-atas{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.merek{color:#fff;font-size:19px;font-weight:800;letter-spacing:-.02em;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.merek span{color:#8FAA9C;font-weight:600}
.cip-contoh{font-size:12px;font-weight:600;color:#C9D8CF;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 10px}
.tautan-puncak{display:flex;flex-wrap:wrap;gap:0 20px;margin-left:auto}
.tautan-puncak a{color:#D6E4DB;font-size:14px;font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.tautan-puncak a:hover{color:#fff;text-decoration:underline}
.puncak :focus-visible{outline-color:#fff}
.masa{display:flex;flex-direction:column;gap:10px}
.masa-teks{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:14px;color:#A9C2B5}
.masa-teks b{color:#fff;font-weight:700}
.masa-hari{display:flex;gap:10px}
.masa-minggu{display:flex;flex-direction:column;gap:6px;min-width:0}
.masa-sel{display:flex;align-items:flex-end;gap:3px;height:30px}
.masa-sel i{flex:1 1 0;height:9px;border-radius:2px 2px 1px 1px;background:rgba(255,255,255,.16)}
.masa-sel i.lewat{height:20px;background:#5FA77F}
.masa-sel i.kini{height:30px;background:var(--padi)}
.masa-hari.hantu .masa-sel i{background:rgba(255,255,255,.09)}
.masa-minggu small{overflow:hidden;font-size:11px;font-weight:600;white-space:nowrap;color:#8FAA9C}

/* Dok menu di bawah. */
.dok{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--malam);box-shadow:0 12px 30px rgba(19,38,31,.28)}
.dok button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#D6E4DB;font-weight:600;font-size:13.5px;white-space:nowrap}
.dok button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dok button:hover{background:rgba(255,255,255,.1);color:#fff}
.dok button[aria-current="page"]{background:#fff;color:var(--malam)}
.dok button:focus-visible{outline-color:#fff;outline-offset:1px}

main{flex:1 1 auto;min-width:0;width:100%;max-width:1240px;margin:0 auto;padding:30px 32px 128px;display:flex;flex-direction:column;gap:18px}
main:focus{outline:none}
.kepala{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;min-height:44px}
.kepala h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.kepala .kecil{font-size:13.5px}

.kartu{background:var(--muka);border:1px solid var(--garis);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.kartu h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.kartu h3{font-size:15px;font-weight:700}
.kartu .sub{font-size:13px;color:var(--batu);margin-top:2px}
.kosong{align-items:flex-start;padding:36px 28px;background:var(--sela);border-style:dashed}
.kosong h2{font-size:20px}
.sempit-maks{max-width:720px}
.daftar-angkatan{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;font-size:14px}
.daftar-angkatan dt{font-weight:600}
.daftar-angkatan dd{margin:0;color:var(--tinta-2)}
.dua{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch}
.dua > .lebar{flex:3 1 420px}
.dua > .sempit{flex:2 1 320px}
.atas{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}

/* Strip angka: satu permukaan, dipisah garis tipis, bukan kotak kembar. */
.angka{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--muka);border:1px solid var(--garis);border-radius:14px}
.angka .kartu{background:none;border:0;border-radius:0;padding:18px 22px;gap:2px}
.angka .kartu + .kartu{border-left:1px solid var(--garis)}
.angka .label{font-size:13px;font-weight:600;color:var(--batu)}
.angka .nilai{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.15;font-variant-numeric:tabular-nums}
.angka .ket{font-size:12.5px;color:var(--batu);overflow-wrap:anywhere}

.batang{display:flex;flex-direction:column;gap:11px}
.batang > div{display:grid;grid-template-columns:minmax(96px,190px) minmax(0,1fr) 48px;gap:12px;align-items:center}
.batang .nama{font-size:13.5px;font-weight:500}
.batang .jalur{height:10px;border-radius:5px;background:var(--alas);overflow:hidden}
.batang .jalur i{display:block;height:100%;border-radius:5px;background:var(--daun)}
.batang .teks{font-size:13.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.tombol{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--garis-tegas);background:var(--muka);color:var(--tinta);font-weight:600;font-size:14px;text-decoration:none}
.tombol:hover{border-color:var(--tinta-2)}
.tombol.utama{border-color:var(--daun);background:var(--daun);color:#fff;font-weight:700}
.tombol.utama:hover{background:var(--daun-tua);border-color:var(--daun-tua)}
.tombol.bahaya{border-color:var(--bata);background:var(--bata);color:#fff;font-weight:700}
.tombol.rapat{min-height:40px;padding:7px 12px;font-size:13.5px}
.tombol.polos{border-color:transparent;background:none;color:var(--daun-tua);padding-inline:6px;text-decoration:underline;text-underline-offset:3px}
.baris{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.aksi{display:flex;flex-wrap:wrap;gap:8px}

.segmen{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--alas);align-self:flex-start}
.segmen button{min-height:38px;padding:6px 14px;border:0;border-radius:8px;background:transparent;color:var(--tinta-2);font-weight:600;font-size:13.5px}
.segmen button[aria-pressed="true"]{background:var(--muka);color:var(--tinta);box-shadow:0 1px 2px rgba(19,38,31,.14)}

.lencana{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.l-baru{background:var(--nila-muda);color:var(--nila)}
.l-ok{background:var(--daun-muda);color:var(--daun-tua)}
.l-salah{background:var(--bata-muda);color:var(--bata-tua)}
.l-ubah,.l-batal{background:var(--alas);color:var(--tinta-2)}

.gulir{position:relative;overflow-x:auto}
.tabel{display:flex;flex-direction:column}
.tabel [role="row"]{display:grid;gap:12px;align-items:center;padding:11px 10px;border-bottom:1px solid var(--alas);font-size:14px}
.tabel [role="row"].judul{padding:8px 10px;border-bottom:1px solid var(--garis);font-size:12.5px;font-weight:700;color:var(--batu)}
.tabel [role="row"]:last-child{border-bottom:0}
.t-pratinjau{min-width:820px}
.t-pratinjau [role="row"]{grid-template-columns:52px 1fr 1.3fr 1fr 1fr 112px 1.5fr}
.t-riwayat{min-width:860px}
.t-riwayat [role="row"]{grid-template-columns:1fr .8fr 1.6fr 1.4fr .9fr 104px 180px}
.t-kab{min-width:620px}
.t-kab [role="row"]{grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 112px 60px 44px;padding:6px 8px}
.t-rujukan{min-width:620px}
.t-rujukan [role="row"]{grid-template-columns:96px minmax(0,1.6fr) 84px minmax(0,1.4fr);padding:8px 4px}
.t-daftar{min-width:980px}
.t-daftar [role="row"]{grid-template-columns:92px 104px minmax(0,1.3fr) 34px minmax(0,1.6fr) 62px 124px 214px}
.t-daftar [role="row"].masuk{box-shadow:inset 3px 0 0 var(--padi);background:var(--padi-muda)}
.t-daftar small{display:block;font-size:12px;color:var(--batu);overflow-wrap:anywhere}

.isian{display:flex;flex-direction:column;gap:6px;min-width:0}
.isian label{font-size:13px;font-weight:600;color:var(--tinta-2)}
input[type="text"],input[type="number"],input[type="search"],input[type="password"],input[type="url"],select{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--garis-tegas);border-radius:10px;background:var(--muka);color:var(--tinta)}
input[type="text"]:hover,input[type="number"]:hover,input[type="search"]:hover,input[type="password"]:hover,input[type="url"]:hover,select:hover{border-color:var(--tinta-2)}
select{font-weight:500}

/* Impor */
.langkah{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.langkah li{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--garis);background:var(--muka);font-size:13.5px;font-weight:600;color:var(--batu)}
.langkah b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--alas);color:var(--tinta);font-size:12.5px}
.langkah li.lewat b{background:var(--daun-muda);color:var(--daun-tua)}
.langkah li[aria-current="step"]{border-color:var(--tinta-2);color:var(--tinta)}
.langkah li[aria-current="step"] b{background:var(--malam);color:#fff}
.jenis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.jenis button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:72px;padding:13px 16px;text-align:left;border-radius:12px;border:1px solid var(--garis);background:var(--muka);color:var(--tinta)}
.jenis button:hover{border-color:var(--garis-tegas)}
.jenis button[aria-pressed="true"]{border-color:var(--daun);box-shadow:inset 0 0 0 1px var(--daun);background:var(--daun-muda)}
.jenis b{font-size:15px}
.jenis span{font-size:12.5px;color:var(--batu)}
.unggah{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px;text-align:center;border:1.5px dashed var(--garis-tegas);border-radius:14px;background:var(--sela)}
.unggah.seret{border-color:var(--daun);background:var(--daun-muda)}
.unggah svg{width:30px;height:30px;fill:none;stroke:var(--batu);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.unggah input:focus-visible + label{outline:3px solid var(--nila);outline-offset:2px}
.status{font-size:13.5px;font-weight:600;color:var(--daun-tua)}
.peringatan{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bata-muda);color:var(--bata-tua);font-size:14px;margin:0}
.peringatan input{width:20px;height:20px;margin:1px 0 0;flex:none}
.peringatan label{font-weight:600}
details.lipat{border-top:1px solid var(--alas)}
details.lipat summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--tinta-2);cursor:pointer}
details.lipat[open] summary{margin-bottom:6px}
details.lipat p{margin-bottom:10px}
.tiga{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tiga > div{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:12px;background:var(--alas);color:var(--tinta-2)}
.tiga > div.baik{background:var(--daun-muda);color:var(--daun-tua)}
.tiga > div.buruk{background:var(--bata-muda);color:var(--bata-tua)}
.tiga > div.biru{background:var(--nila-muda);color:var(--nila)}
.tiga b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tiga span{font-size:12.5px;font-weight:600}

/* Penempatan */
.atur-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:28px;align-items:start}
.atur-grid > div{display:flex;flex-direction:column;gap:14px;min-width:0}
.atur-grid h3{font-size:14px;color:var(--tinta-2)}
.aturan{display:flex;flex-direction:column;gap:12px}
.aturan label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.aturan input{width:20px;height:20px;margin:1px 0 0;flex:none}
.angka-isian{display:flex;flex-wrap:wrap;gap:12px}
.angka-isian .isian{flex:1 1 140px;max-width:240px}
.wilayah{max-height:470px;overflow:auto;border:1px solid var(--alas);border-radius:12px}
.t-kab [role="row"].judul{position:sticky;top:0;z-index:1;background:var(--muka)}
.angka-isian input{font-weight:600}
.posko{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.posko .kartu{padding:16px 18px;gap:10px}
.posko ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.posko li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13.5px}
.posko li small{display:block;font-size:12px;color:var(--batu)}
.posko li b{font-size:12px;color:var(--batu)}
.posko li.ganda small{color:var(--bata-tua);font-weight:600}
.daftar summary{min-height:40px;display:flex;align-items:center;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--daun-tua)}
.daftar ul{max-height:320px;overflow-y:auto;padding-right:6px}

/* Pendaftar */
.siaran{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--batu)}
.siaran b{color:var(--tinta)}
.titik{display:inline-block;width:10px;height:10px;flex:none;border-radius:50%;background:var(--daun)}
.titik.muat{background:var(--garis-tegas)}
.titik.mati{background:var(--bata)}
@media (prefers-reduced-motion:no-preference){
  .titik:not(.muat):not(.mati){animation:denyut 2.4s ease-out infinite}
  @keyframes denyut{0%{box-shadow:0 0 0 0 rgba(31,122,77,.45)}70%,100%{box-shadow:0 0 0 8px rgba(31,122,77,0)}}
}
.cari{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.cari .isian{flex:1 1 220px}
.sambung{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.alasan{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.alasan input{flex:1 1 100%;min-height:40px}
.setuju{display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer}
.setuju input{width:20px;height:20px;margin:1px 0 0;flex:none}

@media (max-width:900px){
  .atur-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .dok button{padding:0 11px}
  .dok button span{display:none}
  .dok button[aria-current="page"] span{display:inline}
}
@media (max-width:760px){
  .angka{grid-template-columns:repeat(2,minmax(0,1fr))}
  .angka .kartu:nth-child(3){border-left:0}
  .angka .kartu:nth-child(n+3){border-top:1px solid var(--garis)}
  .angka .kartu{padding:14px 16px}
  .angka .nilai{font-size:28px}
}
@media (max-width:640px){
  .t-kab{min-width:0}
  .t-kab [role="row"].judul{display:none}
  .t-kab [role="row"]{grid-template-columns:minmax(0,1fr) 88px 44px;grid-template-areas:"nama nama hapus" "bahasa bobot kuota";gap:6px 8px;padding:10px 8px}
  .t-kab [role="cell"]:nth-child(1){grid-area:nama}
  .t-kab [role="cell"]:nth-child(2){grid-area:bahasa}
  .t-kab [role="cell"]:nth-child(3){grid-area:bobot}
  .t-kab [role="cell"]:nth-child(4){grid-area:kuota;text-align:center}
  .t-kab [role="cell"]:nth-child(5){grid-area:hapus}
  .batang > div{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nama teks" "jalur jalur";gap:4px 10px}
  .batang .nama{grid-area:nama}
  .batang .jalur{grid-area:jalur}
  .batang .teks{grid-area:teks}
  .t-daftar{min-width:0}
  .t-daftar [role="row"].judul{display:none}
  .t-daftar [role="row"]{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"nama nama status" "nim jk bahasa" "jur jur jur" "waktu waktu waktu" "aksi aksi aksi";gap:4px 12px;padding:14px 4px}
  .t-daftar [role="row"].masuk{padding-left:12px}
  .t-daftar .c-waktu{grid-area:waktu;font-size:12px;color:var(--batu)}
  .t-daftar .c-waktu small{display:inline;margin-left:6px;color:var(--tinta-2);font-weight:600}
  .t-daftar .c-nim{grid-area:nim;color:var(--tinta-2)}
  .t-daftar .c-nama{grid-area:nama;font-size:14.5px}
  .t-daftar .c-jk{grid-area:jk;color:var(--tinta-2)}
  .t-daftar .c-jk::before{content:"JK ";color:var(--batu)}
  .t-daftar .c-bahasa{grid-area:bahasa;color:var(--tinta-2)}
  .t-daftar .c-bahasa::before{content:"B/M ";color:var(--batu)}
  .t-daftar .c-jur{grid-area:jur}
  .t-daftar .c-status{grid-area:status;text-align:right}
  .t-daftar .c-aksi{grid-area:aksi;padding-top:6px}
  .masa-hari{gap:4px}
  .masa-sel{gap:1px;height:24px}
  .masa-sel i.lewat{height:15px}
  .masa-sel i.kini{height:24px}
  .masa-minggu small{display:none}
}
@media (max-width:400px){
  .dok{gap:2px;padding:5px}
  .dok button{padding:0 9px;font-size:13px}
}
@media (max-width:560px){

      'SET @tertaut = (SELECT COUNT(DISTINCT d.pengguna_id) FROM daftarbimbingan d JOIN pengguna g ON g.id = d.pengguna_id JOIN impor_peserta i ON i.kode = g.kode WHERE g.angkatan_id = @angkatan_id);',

  // Kecamatan lokasi KKN Angkatan 78 beserta jumlah mahasiswanya (sumber sama dengan WILAYAH_78).

  // Lokasi KKN Angkatan 78 menurut Pengumuman Lokasi Mahasiswa KKN Angkatan 78
  // Tahun 2026 (LP2M UIN Alauddin, 2 Maret 2026): 1.544 mahasiswa, 7 kabupaten,
  // 21 kecamatan. Bahasa setempat menurut artikel Bahasa Bugis dan Bahasa

  var WILAYAH_78 = [

    ['Luwu', 'Kamanre, Larompong, Larompong Selatan', 173, 'Tidak tercatat sebagai wilayah Bugis atau Makassar']
  ];

  var LENCANA = { baru: ['Baru', 'l-baru'], ubah: ['Diperbarui', 'l-ubah'], salah: ['Bermasalah', 'l-salah'] };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {

  }
  function persen(a, b) { return Math.round((a / b) * 100) + '%'; }
  function tombolPilih(aksi, label, aktif) {

  function barisImpor() { return S.berkasData || []; }
  function hitungImpor(semua) {
    var h = { total: semua.length, baru: 0, ubah: 0, salah: 0 };

  }

  // ---------------------------------------------------------------- Ringkasan
  // Ringkasan hanya menghitung data yang dimuat pada peramban ini (Impor data atau Pendaftar).
  function hitungMenurut(daftar, f) {
    var h = {};

    return Object.keys(h).map(function (k) { return [k, h[k]]; }).sort(function (a, b) { return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); });
  }
  function batangJumlah(pasangan, pembagi) {

    }).join('') + '</div>';
  }
  function kosong(judul, teks, tombol) {
    return '<section class="kartu kosong"><div><h2>' + judul + '</h2><p class="sub">' + teks + '</p></div><div class="baris">' + tombol + '</div></section>';
  }
  function ringkasan() {
    var P = S.pesertaAktif, D = S.dimuat, H = S.penempatan;
    var ada = P || D.angkatan || D.lokasi || D.pembimbing;
    var kosongkan = !ada ? '' : (S.tanyaKosong
      ? '<div class="baris"><span class="kecil">Hapus semua data dari peramban ini?</span><button type="button" class="tombol bahaya rapat" data-a="kosongkan-ya">Ya, kosongkan</button><button type="button" class="tombol rapat" data-a="kosongkan-tidak">Batal</button></div>'
      : '<button type="button" class="tombol rapat" data-a="kosongkan-minta">Kosongkan data</button>');

    if (!ada) {
      return kepala + kosong('Belum ada data', 'Muat berkas lewat Impor data, atau ambil pendaftar yang sudah diverifikasi.',
        '<button type="button" class="tombol utama" data-a="layar:impor">Impor data</button><button type="button" class="tombol" data-a="layar:pendaftar">Buka Pendaftar</button>');
    }
    var ditempatkan = H ? H.unit.reduce(function (n, u) { return n + u.anggota.length; }, 0) : 0;
    var dosen = D.pembimbing ? hitungMenurut(D.pembimbing, function (x) { return x.nip; }).length : 0;
    var kartu = [
      ['Peserta', P ? P.length : '–', P ? S.sumberPeserta : 'belum dimuat'],
      ['Ditempatkan', H ? ditempatkan : '–', H ? H.unit.length + ' ' + (S.satuan === 'posko' ? 'posko' : 'wilayah') : (P ? 'belum diacak' : 'belum ada peserta')],
      ['Lokasi', D.lokasi ? D.lokasi.length : '–', D.lokasi ? 'kecamatan' : 'belum dimuat'],
      ['Pembimbing', D.pembimbing ? dosen : '–', D.pembimbing ? hitungMenurut(D.pembimbing, function (x) { return x.kec; }).length + ' kecamatan' : 'belum dimuat']
    ].map(function (k) {
      return '<div class="kartu"><span class="label">' + k[0] + '</span><span class="nilai">' + k[1] + '</span><span class="ket">' + esc(k[2]) + '</span></div>';
    }).join('');
    var html = kepala + '<section class="angka" aria-label="Angka ringkas">' + kartu + '</section>';
    if (P) {
      var n = P.length, jumlah = function (f) { return P.filter(f).length; };
      var rinci = [
        ['Laki-laki', jumlah(function (m) { return m.jk === 'L'; })], ['Perempuan', jumlah(function (m) { return m.jk === 'P'; })],
        ['Bugis aktif', jumlah(function (m) { return m.bugis === 2; })], ['Bugis pasif', jumlah(function (m) { return m.bugis === 1; })],
        ['Makassar aktif', jumlah(function (m) { return m.makassar === 2; })], ['Makassar pasif', jumlah(function (m) { return m.makassar === 1; })]
      ];
      html += '<section class="dua"><div class="kartu lebar"><div><h2>Peserta per fakultas</h2><p class="sub">' + jumlahProdi(P) + ' prodi</p></div>' +
        batangJumlah(hitungMenurut(P, function (m) { return m.fak; }), n) + '</div>' +
        '<div class="kartu sempit"><h2>Jenis kelamin dan bahasa</h2>' + batangJumlah(rinci, n) + '</div></section>';
    }
    if (H) {
      var unit = H.unit.map(function (u) { return [u.nama, u.anggota.length]; });
      html += '<section class="kartu"><div class="atas"><h2>Hasil penempatan</h2><span class="kecil">Benih ' + H.benih + '</span></div>' +
        batangJumlah(unit, Math.max.apply(null, unit.map(function (u) { return u[1]; }))) + '</section>';
    }
    if (D.angkatan) {
      html += '<section class="kartu"><h2>Angkatan</h2><dl class="daftar-angkatan">' + D.angkatan.map(function (a) {
        return '<dt>Angkatan ' + esc(a.angkatan) + '</dt><dd>' + esc(tanggalPanjang(a.mulai)) + ' sampai ' + esc(tanggalPanjang(a.selesai)) + (a.hari ? ', ' + esc(a.hari) + ' hari' : '') + '</dd>';
      }).join('') + '</dl></section>';
    }
    return html + '<p class="kecil">Kehadiran, pendaftaran wajah, dan LKH tampil setelah dashboard tersambung ke basis data.</p>';
  }

  // -------------------------------------------------------------------- Impor
  var IKON_UNGGAH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M4 15v5h16v-5"/></svg>';
  function impor() {
    var J = IMPOR[S.jenis];
    var semua = barisImpor();
    var h = hitungImpor(semua);
    var langkah = ['Unggah', 'Periksa', 'Konfirmasi', 'Selesai'].map(function (l, i) {
      var no = i + 1;
      return '<li' + (S.langkah === no ? ' aria-current="step"' : '') + (S.langkah > no ? ' class="lewat"' : '') + '><b>' + no + '</b>' + l + '</li>';
    }).join('');
    var isi = '';

    if (S.langkah === 1) {
      var jenis = ['peserta', 'pembimbing', 'lokasi', 'angkatan'].map(function (id) {
        return '<button type="button" data-a="jenis:' + id + '" aria-pressed="' + (S.jenis === id ? 'true' : 'false') + '"><b>' + IMPOR[id].nama + '</b><span>' + IMPOR[id].uraian + '</span></button>';
      }).join('');
      isi = '<section class="kartu"><div class="jenis" role="group" aria-label="Jenis data">' + jenis + '</div>' +
        '<div class="unggah" id="zona">' + IKON_UNGGAH +
        '<input class="sr" id="berkas" type="file" accept=".xlsx,.csv"><label class="tombol" for="berkas">Pilih berkas ' + J.nama.toLowerCase() + '</label>' +
        '<span class="kecil">atau tarik ke sini. Excel (.xlsx) atau CSV.</span>' +
        (S.berkas ? '<span role="status" class="status">' + esc(S.berkas) + ' siap diperiksa</span>' : '') + '</div>' +
        (S.galatBerkas ? '<p class="peringatan" role="alert">' + esc(S.galatBerkas) + '</p>' : '') +
        '<div class="atas"><button type="button" class="tombol utama" data-a="langkah:2"' + (S.berkas ? '' : ' disabled') + '>Periksa berkas</button>' +
        '<a class="tombol polos" href="Templat-Impor-LKH-KKN.xlsx" download>Unduh templat Excel</a></div>' +
        '<details class="lipat"><summary>Kolom yang dibaca</summary>' +
        '<p class="kecil"><b>Wajib:</b> ' + J.kolom.join(', ') + '.' + (J.kolomLain ? ' <b>Pilihan:</b> ' + J.kolomLain + '.' : '') + '</p>' +
        '<p class="kecil"><b>Ditulis ke</b> ' + J.tujuan + '</p>' +
        (S.jenis === 'peserta' ? '<p class="kecil">Unduhan Sheet pendaftaran juga terbaca tanpa disunting.</p>' : '') + '</details></section>';
    } else if (S.langkah === 2) {
      var saring = [['semua', 'Semua', h.total], ['baru', 'Baru', h.baru], ['ubah', 'Diperbarui', h.ubah], ['salah', 'Bermasalah', h.salah]].map(function (t) {
        return tombolPilih('saring:' + t[0], t[1] + ' (' + t[2] + ')', S.saring === t[0]);
      }).join('');
      var tersaring = semua.filter(function (r) { return S.saring === 'semua' || r.jenis === S.saring; });
      var baris = tersaring.slice(0, 300).map(function (r) {
        return '<div role="row"><span role="cell" class="angka-rata kecil">' + r.baris + '</span><span role="cell" class="angka-rata">' + esc(r.c[0]) + '</span><span role="cell" class="tebal">' + esc(r.c[1]) + '</span><span role="cell">' + esc(r.c[2]) + '</span><span role="cell">' + esc(r.c[3]) + '</span>' +
          '<span role="cell"><span class="lencana ' + LENCANA[r.jenis][1] + '">' + LENCANA[r.jenis][0] + '</span></span><span role="cell" class="kecil">' + esc(r.ket) + '</span></div>';
      }).join('');
      var boleh = h.salah === 0 || S.lewati;
      isi = '<section class="kartu"><div class="atas"><div><h2>' + esc(S.berkas) + '</h2><p class="sub">' + h.total + ' baris ' + J.nama.toLowerCase() + (tersaring.length > 300 ? ', menampilkan 300 pertama' : '') + '</p></div>' +
        '<div class="segmen" role="group" aria-label="Saring baris">' + saring + '</div></div>' +
        '<div class="gulir"><div class="tabel t-pratinjau" role="table" aria-label="Pratinjau baris"><div role="row" class="judul"><span role="columnheader">Baris</span>' +
        J.kolom.map(function (k) { return '<span role="columnheader">' + k + '</span>'; }).join('') + '<span role="columnheader">Status</span><span role="columnheader">Keterangan</span></div>' + baris + '</div></div>' +
        (h.salah > 0 ? '<div class="peringatan"><input id="lewati" type="checkbox"' + (S.lewati ? ' checked' : '') + '><label for="lewati">Lewati ' + h.salah + ' baris bermasalah dan impor sisanya</label></div>' : '') +
        '<div class="baris"><button type="button" class="tombol" data-a="langkah:1">Kembali</button><button type="button" class="tombol utama" data-a="langkah:3"' + (boleh ? '' : ' disabled') + '>Lanjut</button></div></section>';
    } else if (S.langkah === 3) {

        '<div class="biru"><b>' + h.baru + '</b><span>baru</span></div>' +
        '<div><b>' + h.ubah + '</b><span>diperbarui</span></div>' +
        '<div class="buruk"><b>' + h.salah + '</b><span>dilewati</span></div></div>' +
        '<p class="kecil">Tercatat di Riwayat dan dapat dibatalkan.</p>' +
        '<div class="baris"><button type="button" class="tombol" data-a="langkah:2">Kembali</button><button type="button" class="tombol utama" data-a="impor">Impor sekarang</button></div></section>';
    } else {
      isi = '<section class="kartu sempit-maks" role="status"><p class="tebal">' + esc(S.hasil) + '</p>' +
        (S.jenis === 'peserta' && S.pesertaAktif ? '<div class="baris"><button type="button" class="tombol utama" data-a="layar:penempatan">Tempatkan peserta</button></div>' + kotakSql('unduh-sql-peserta', 'Unduh SQL tanpa penempatan') : '') +
        kotakSqlJenis() +

    }

    return '<header class="kepala"><h1>Impor data</h1><ol class="langkah" aria-label="Langkah impor">' + langkah + '</ol></header>' + isi;
  }

  // --------------------------------------------------------------- Penempatan
  function koma(x) { return (Math.round(x * 10) / 10).toString().replace('.', ','); }
  function penempatan() {
    if (!S.pesertaAktif) {
      return '<header class="kepala"><h1>Penempatan</h1></header>' +
        kosong('Belum ada peserta', 'Muat peserta lewat Impor data, atau pakai pendaftar yang sudah diverifikasi.',
          '<button type="button" class="tombol utama" data-a="layar:impor">Impor data</button><button type="button" class="tombol" data-a="layar:pendaftar">Buka Pendaftar</button>');
    }
    var H = S.penempatan, peserta = dataPeserta(), perKab = S.satuan === 'kabupaten';
    var susunan = susunSatuan(), satuan = susunan.satuan;
    var kuota = bagiKuota(peserta.length, satuan.map(function (x) { return x.bobot; }));
    var centang = function (id, k, teks) {
      return '<label for="' + id + '"><input id="' + id + '" type="checkbox"' + (S.aturan[k] ? ' checked' : '') + '><span>' + teks + '</span></label>';
    };
    var angka = function (id, label, nilai, min, maks) {
      return '<div class="isian"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="number" inputmode="numeric" min="' + min + '" max="' + maks + '" value="' + nilai + '"></div>';
    };
    var peringatan = '', pengaturan = '';

    if (perKab) {
      var pilihanBahasa = function (v) {
        return [['', 'Lainnya'], ['bugis', 'Bugis'], ['makassar', 'Makassar'], ['keduanya', 'Bugis dan Makassar']].map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('');
      };
      var nomorKuota = 0;
      pengaturan = '<div class="gulir wilayah" role="region" tabindex="0" aria-label="Daftar wilayah, dapat digulir"><div class="tabel t-kab" role="table" aria-label="Daftar wilayah"><div role="row" class="judul"><span role="columnheader">Wilayah</span><span role="columnheader">Bahasa</span><span role="columnheader">Daya tampung</span><span role="columnheader">Kuota</span><span role="columnheader"><span class="sr">Hapus</span></span></div>' +
        S.kab.map(function (x, i) {
          var dipakai = x.nama.trim() !== '' && x.bobot > 0;
          var k = dipakai ? kuota[nomorKuota++] : 0;
          return '<div role="row"><span role="cell"><input id="kab-nama-' + i + '" type="text" maxlength="40" aria-label="Nama wilayah baris ' + (i + 1) + '" value="' + esc(x.nama) + '"></span>' +
            '<span role="cell"><select id="kab-bahasa-' + i + '" aria-label="Bahasa setempat baris ' + (i + 1) + '">' + pilihanBahasa(x.bahasa) + '</select></span>' +
            '<span role="cell"><input id="kab-bobot-' + i + '" type="number" inputmode="numeric" min="1" max="100000" aria-label="Daya tampung baris ' + (i + 1) + '" value="' + x.bobot + '"></span>' +
            '<span role="cell" class="tebal angka-rata">' + (dipakai ? k : '–') + '</span>' +
            '<span role="cell"><button type="button" class="tombol rapat" data-a="kab-hapus:' + i + '" aria-label="Hapus ' + esc(x.nama || 'baris ' + (i + 1)) + '" title="Hapus">✕</button></span></div>';
        }).join('') + '</div></div>' +
        '<div class="baris"><button type="button" class="tombol rapat" data-a="kab-tambah">Tambah wilayah</button><button type="button" class="tombol rapat" data-a="kab-78">7 kabupaten Angkatan 78</button><button type="button" class="tombol rapat" data-a="kec-78">21 kecamatan Angkatan 78</button></div>' +
        '<p class="kecil">Kuota sebanding daya tampung. Basis data menyimpan kecamatan, jadi pakai daftar kecamatan bila hasilnya akan diunduh sebagai SQL.</p>' +
        '<div class="angka-isian">' + angka('isiposko', 'Peserta per posko', S.isiPosko, 2, 100) + '</div>';
      if (!satuan.length) peringatan += '<p class="peringatan">Tambahkan sekurangnya satu wilayah.</p>';
      if (S.aturan.bahasa) {
        [['bugis', 'Bugis'], ['makassar', 'Makassar'], ['keduanya', 'Bugis atau Makassar']].forEach(function (b) {
          var butuh = 0;
          satuan.forEach(function (x, i) { if (x.bahasa === b[0]) butuh += Math.min(kuota[i], susunan.opsi.butuh(kuota[i])); });
          if (!butuh) return;
          var aktif = peserta.filter(function (m) { return tingkatBahasa(m, b[0]) === 2; }).length;
          var pasif = peserta.filter(function (m) { return tingkatBahasa(m, b[0]) === 1; }).length;
          if (aktif + pasif < butuh) peringatan += '<p class="peringatan">Penutur ' + b[1] + ' kurang: butuh ' + butuh + ', ada ' + aktif + ' aktif dan ' + pasif + ' pasif.</p>';
          else if (aktif < butuh) peringatan += '<p class="kecil">Penutur aktif ' + b[1] + ' ' + aktif + ' dari ' + butuh + '; sisanya penutur pasif.</p>';
        });
      }
    } else {
      var lebih = prodiBerlebih(peserta, S.nPosko);
      var batas = lebih.reduce(function (t, p) { return t + p[1] - S.nPosko; }, 0);
      pengaturan = '<div class="angka-isian">' + angka('nposko', 'Jumlah posko', S.nPosko, 1, 500) + angka('nbugis', 'Posko wilayah Bugis', S.nBugis, 0, S.nPosko) + angka('nmakassar', 'Posko wilayah Makassar', S.nMakassar, 0, S.nPosko) + '</div>';
      if (S.aturan.bahasa) {
        [['bugis', S.nBugis], ['makassar', S.nMakassar]].forEach(function (b) {
          if (!b[1]) return;

          var pasif = peserta.filter(function (m) { return m[b[0]] === 1; }).length;
          if (aktif + pasif < butuh) peringatan += '<p class="peringatan">Penutur ' + NAMA_BAHASA[b[0]] + ' kurang: butuh ' + butuh + ' untuk ' + b[1] + ' posko, ada ' + aktif + ' aktif dan ' + pasif + ' pasif.</p>';
          else if (aktif < butuh) peringatan += '<p class="kecil">Penutur aktif ' + NAMA_BAHASA[b[0]] + ' ' + aktif + ' dari ' + butuh + '; sisanya penutur pasif.</p>';
        });
      }
      if (S.aturan.prodi && lebih.length) {
        peringatan += '<p class="peringatan">Aturan prodi tidak terpenuhi penuh dengan ' + S.nPosko + ' posko: ' +

    var aturan = perKab

        centang('a-jk', 'jk', 'Laki-laki dan perempuan sebanding') +

        '<span role="cell"><span class="lencana ' + (r.status === 'Berhasil' ? 'l-ok' : 'l-batal') + '">' + r.status + '</span></span><span role="cell" class="aksi">' + aksi + '</span></div>';
    }).join('');
    return kepala + '<section class="kartu"><div class="gulir"><div class="tabel t-riwayat" role="table" aria-label="Riwayat impor"><div role="row" class="judul">' +
      ['Waktu', 'Jenis', 'Sumber', 'Hasil', 'Oleh', 'Status', '<span class="sr">Tindakan</span>'].map(function (k) { return '<span role="columnheader">' + k + '</span>'; }).join('') + '</div>' + baris + '</div></div>' +
      '<p class="kecil">Membatalkan impor hanya mengeluarkan datanya dari dashboard. Basis data tidak berubah.</p></section>';
  }

  // ------------------------------------------------------------------- render
  var utama = document.getElementById('utama');
  var menu = document.getElementById('menu');
  var masa = document.getElementById('masa');
  // Garis waktu pada kepala halaman: satu sel per hari KKN dari lembar Angkatan yang dimuat.
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  function tanggalPanjang(iso) { var b = String(iso).split('-'); return Number(b[2]) + ' ' + BULAN[Number(b[1]) - 1] + ' ' + b[0]; }
  function hariIni() { var t = new Date(); return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2); }
  function garisWaktu() {
    var daftar = (S.dimuat.angkatan || []).filter(function (a) { return a.mulai && a.selesai; }).sort(function (a, b) { return a.mulai < b.mulai ? -1 : 1; });
    if (!daftar.length) {
      var hantu = '';
      for (var w = 0; w * 7 < LAMA; w++) {
        var c = Math.min(7, LAMA - w * 7), kosongSel = '';
        for (var d = 0; d < c; d++) kosongSel += '<i></i>';
        hantu += '<div class="masa-minggu" style="flex:' + c + ' 1 0"><div class="masa-sel">' + kosongSel + '</div><small>Minggu ' + (w + 1) + '</small></div>';
      }
      return '<div class="masa-teks"><span><b>Belum ada angkatan.</b> Impor lembar Angkatan untuk melihat hari ke berapa.</span></div><div class="masa-hari hantu" aria-hidden="true">' + hantu + '</div>';
    }
    var kini = hariIni();
    var A = daftar.filter(function (a) { return a.selesai >= kini; })[0] || daftar[daftar.length - 1];
    var total = Math.max(1, Math.min(366, Number(A.hari) || selisihHari(A.mulai, A.selesai) + 1));
    var n = selisihHari(A.mulai, kini) + 1, ket, kanan, html = '';
    if (n < 1) { ket = 'mulai ' + tanggalPanjang(A.mulai); kanan = (1 - n) + ' hari lagi'; }
    else if (n > total) { ket = 'berakhir ' + tanggalPanjang(A.selesai); kanan = 'Masa KKN selesai'; }
    else { ket = 'hari ke-' + n + ' dari ' + total; kanan = total - n > 0 ? (total - n) + ' hari lagi' : 'Hari terakhir'; }
    for (var m = 0; m * 7 < total; m++) {
      var isi = Math.min(7, total - m * 7), sel = '';
      for (var h = m * 7 + 1; h <= m * 7 + isi; h++) sel += '<i' + (h < n ? ' class="lewat"' : (h === n ? ' class="kini"' : '')) + '></i>';
      html += '<div class="masa-minggu" style="flex:' + isi + ' 1 0"><div class="masa-sel">' + sel + '</div><small>Minggu ' + (m + 1) + '</small></div>';
    }
    return '<div class="masa-teks"><span><b>Angkatan ' + esc(A.angkatan) + '</b>, ' + ket + '</span><span>' + kanan + '</span></div>' +
      '<div class="masa-hari" role="img" aria-label="Angkatan ' + esc(A.angkatan) + ', ' + ket + ', ' + total + ' hari">' + html + '</div>';
  }
  var IKON_MENU = {
    ringkasan: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    impor: '<path d="M12 15V4M8 8l4-4 4 4M4 15v5h16v-5"/>',
    penempatan: '<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    riwayat: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    pendaftar: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.6a6.5 6.5 0 0 1 3.5 5.4"/>'
  };

  function render(fokusKe) {
    var aktif = document.activeElement;
    var kunci = fokusKe || (aktif && (aktif.getAttribute('data-a') || aktif.id)) || '';
    // Posisi kursor pada isian teks dipulihkan sesudah halaman digambar ulang.
    var pilihan = null;
    try { if (!fokusKe && aktif && aktif.tagName === 'INPUT' && aktif.id && typeof aktif.selectionStart === 'number') pilihan = [aktif.selectionStart, aktif.selectionEnd]; } catch (e) { pilihan = null; }
    menu.innerHTML = [['ringkasan', 'Ringkasan'], ['pendaftar', 'Pendaftar'], ['impor', 'Impor data'], ['penempatan', 'Penempatan'], ['riwayat', 'Riwayat impor']].map(function (n) {
      return '<button type="button" data-a="layar:' + n[0] + '" title="' + n[1] + '" aria-label="' + n[1] + '"' + (S.layar === n[0] ? ' aria-current="page"' : '') + '>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' + IKON_MENU[n[0]] + '</svg><span>' + n[1] + '</span></button>';
    }).join('');
    masa.innerHTML = garisWaktu();
    utama.innerHTML = S.layar === 'ringkasan' ? ringkasan() : S.layar === 'pendaftar' ? pendaftar() : (S.layar === 'impor' ? impor() : (S.layar === 'penempatan' ? penempatan() : riwayat()));
    if (kunci) {
      var el = document.querySelector('[data-a="' + kunci + '"]') || document.getElementById(kunci);
      if (el && !el.disabled) {
        el.focus({ preventScroll: true });
        if (pilihan) { try { el.setSelectionRange(pilihan[0], pilihan[1]); } catch (e) { /* jenis isian tanpa kursor */ } }
      }
    }
  }
  // Data yang dimuat disimpan di peramban ini saja, supaya tidak hilang saat halaman dimuat ulang.
  var KUNCI_SIMPAN = 'kkn-dashboard-v1';
  var DISIMPAN = ['pesertaAktif', 'sumberPeserta', 'dimuat', 'riwayat', 'penempatan', 'penempatanTersimpan', 'satuan', 'kab', 'isiPosko', 'nPosko', 'nBugis', 'nMakassar', 'aturan', 'angkatanSql', 'alamatAdmin', 'kunciAdmin', 'lSaring', 'hanyaVerif'];
  function simpan() {
    try { var d = {}; DISIMPAN.forEach(function (k) { d[k] = S[k]; }); localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(d)); } catch (e) { /* penyimpanan peramban tidak tersedia */ }
  }
  function muat() {
    try {
      var d = JSON.parse(localStorage.getItem(KUNCI_SIMPAN) || 'null');
      if (d && typeof d === 'object') DISIMPAN.forEach(function (k) { if (d[k] !== undefined && d[k] !== null) S[k] = d[k]; });
    } catch (e) { /* data tersimpan rusak atau penyimpanan tidak tersedia */ }
  }
  function atur(perubahan, fokusKe) {
    for (var k in perubahan) S[k] = perubahan[k];
    simpan();
    render(fokusKe);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t || t.disabled) return;
    var bagian = t.getAttribute('data-a').split(':');
    var a = bagian[0], v = bagian[1];
    if (a === 'layar') atur({ layar: v, tanyaBatal: null, tanyaKosong: false });
    else if (a === 'rentang') atur({ rentang: v });
    else if (a === 'kelompok') atur({ kelompok: v });
    else if (a === 'tindak') atur({ tindak: v });
    else if (a === 'jenis') atur({ jenis: v, berkas: null, berkasData: null, galatBerkas: '', saring: 'semua', lewati: false });
    else if (a === 'contoh') atur({ berkas: IMPOR[S.jenis].contoh, berkasData: null, galatBerkas: '' });
    else if (a === 'saring') atur({ saring: v });
    else if (a === 'langkah') { atur({ langkah: Number(v), saring: 'semua' }); utama.focus({ preventScroll: true }); }
    else if (a === 'impor') {
      var h = hitungImpor(barisImpor());
      var J = IMPOR[S.jenis];
      var id = S.riwayat.reduce(function (m, r) { return Math.max(m, r.id); }, 0) + 1;
      var asli = !!S.berkasData;
      if (asli && S.jenis !== 'peserta') {
        var sah = S.berkasData.filter(function (r) { return r.obj; }).map(function (r) { return r.obj; });
        if (sah.length) S.dimuat[S.jenis] = sah;
      }
      var dimuat = asli && S.jenis === 'peserta' ? S.berkasData.filter(function (r) { return r.peserta; }).map(function (r) { return r.peserta; }) : [];
      if (dimuat.length) {
        S.pesertaAktif = dimuat;
        S.sumberPeserta = S.berkas;
        S.penempatan = null; S.penempatanTersimpan = false;
        S.nPosko = Math.max(1, Math.min(S.nPosko, S.pesertaAktif.length));
        S.nBugis = Math.min(S.nBugis, S.nPosko); S.nMakassar = Math.min(S.nMakassar, S.nPosko - S.nBugis);
      }
      atur({
        langkah: 4,
        riwayat: [{ id: id, kunci: S.jenis, waktu: new Date().toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), jenis: J.nama, berkas: S.berkas, baru: h.baru, ubah: h.ubah, lewat: h.salah, oleh: 'Peramban ini', status: 'Berhasil' }]
          .concat(S.riwayat.map(function (r) { return r.kunci === S.jenis && r.status === 'Berhasil' ? Object.assign({}, r, { status: 'Digantikan' }) : r; })),
        hasil: asli
          ? h.baru + ' ' + (S.jenis === 'peserta' ? 'peserta' : 'baris ' + J.nama.toLowerCase()) + ' dimuat dari berkas ' + S.berkas + ' dan ' + h.salah + ' baris dilewati.'
          : h.baru + ' baris ' + J.nama.toLowerCase() + ' ditambahkan, ' + h.ubah + ' diperbarui, dan ' + h.salah + ' dilewati dari berkas ' + S.berkas + '.'
      }, 'riwayat-buka');
    }
    else if (a === 'l-sambung') {
      var alamat = (S.alamatDraft || alamatAdmin()).trim(), kunciBaru = S.kunciDraft.trim();
      if (!POLA_ALAMAT.test(alamat)) atur({ lPesan: 'Alamat harus berbentuk https://script.google.com/macros/s/.../exec.' }, 'l-alamat');
      else if (kunciBaru.length < 32) atur({ lPesan: 'Kunci admin terlalu pendek. Salin seluruh kunci dari Log eksekusi.' }, 'l-kunci');
      else { atur({ alamatAdmin: alamat === ALAMAT_BAWAAN ? '' : alamat, kunciAdmin: kunciBaru, kunciDraft: '', alamatDraft: '', L: null, lStatus: 'muat', lPesan: '', masuk: {} }, 'l-segarkan'); cekPendaftar(); }
    }
    else if (a === 'l-putus') atur({ kunciAdmin: '', L: null, lStatus: '', lPesan: '', lPesanBaris: '', tolakNim: null, masuk: {} }, 'l-kunci');
    else if (a === 'l-segarkan') cekPendaftar();
    else if (a === 'l-saring') atur({ lSaring: v });
    else if (a === 'l-verif') ubahStatusPendaftar(v, 'Diverifikasi', '');
    else if (a === 'l-kembali') ubahStatusPendaftar(v, 'Baru', '');
    else if (a === 'l-tolak') atur({ tolakNim: v, alasan: '', lPesanBaris: '' }, 'alasan');
    else if (a === 'l-tolak-batal') atur({ tolakNim: null }, 'l-tolak:' + v);
    else if (a === 'l-tolak-ya') {
      var alasan = S.alasan.replace(/\s+/g, ' ').trim();
      if (alasan && !POLA_CATATAN.test(alasan)) atur({ lPesanBaris: 'Alasan harus diawali huruf atau angka.' }, 'alasan');
      else ubahStatusPendaftar(v, 'Ditolak', alasan);
    }
    else if (a === 'l-pakai') pakaiPendaftar();
    else if (a === 'riwayat-buka') atur({ layar: 'riwayat', langkah: 1, berkas: null, berkasData: null, lewati: false, saring: 'semua' }, 'layar:riwayat');
    else if (a === 'impor-lagi') { atur({ langkah: 1, berkas: null, berkasData: null, lewati: false, saring: 'semua' }); utama.focus({ preventScroll: true }); }
    else if (a === 'acak') {
      var susunan = susunSatuan();
      if (susunan.satuan.length) atur({ penempatan: tempatkan(dataPeserta(), susunan.satuan, S.aturan, Math.floor(Math.random() * 900000) + 100000, susunan.opsi), penempatanTersimpan: false });
    }
    else if (a === 'satuan') atur({ satuan: v, penempatan: null, penempatanTersimpan: false });
    else if (a === 'kab-tambah') { S.kab.push({ nama: '', bahasa: '', bobot: 100 }); atur({ penempatan: null, penempatanTersimpan: false }, 'kab-nama-' + (S.kab.length - 1)); }
    else if (a === 'kab-hapus') { S.kab.splice(Number(v), 1); atur({ penempatan: null, penempatanTersimpan: false }, 'kab-tambah'); }
    else if (a === 'kab-78') atur({ kab: kabupatenBawaan(), penempatan: null, penempatanTersimpan: false });
    else if (a === 'kec-78') atur({ kab: kecamatanBawaan(), penempatan: null, penempatanTersimpan: false });
    else if (a === 'unduh-sql' && S.penempatan && angkatanSah()) {
      var baris = [];
      S.penempatan.unit.forEach(function (p) { p.anggota.forEach(function (m) { baris.push({ m: m, penempatan: p.nama }); }); });
      unduhTeks('impor-peserta-angkatan-' + angkatanSah() + '-benih-' + S.penempatan.benih + '.sql',
        buatSql(baris, angkatanSah(), 'Penempatan dengan benih acak ' + S.penempatan.benih + '.'), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-angkatan' && S.dimuat.angkatan) {
      unduhTeks('impor-angkatan.sql', buatSqlAngkatan(S.dimuat.angkatan), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-lokasi' && S.dimuat.lokasi && angkatanSah()) {
      unduhTeks('impor-lokasi-angkatan-' + angkatanSah() + '.sql', buatSqlLokasi(S.dimuat.lokasi, angkatanSah()), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-pembimbing' && S.dimuat.pembimbing) {
      unduhTeks('impor-pembimbing.sql', buatSqlPembimbing(S.dimuat.pembimbing), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-peserta' && S.pesertaAktif && angkatanSah()) {
      unduhTeks('impor-peserta-angkatan-' + angkatanSah() + '-tanpa-penempatan.sql',
        buatSql(S.pesertaAktif.map(function (m) { return { m: m, penempatan: '' }; }), angkatanSah(), 'Tanpa penempatan.'), 'application/sql;charset=utf-8');
    }
    else if (a === 'simpan-penempatan') atur({ penempatanTersimpan: true }, 'unduh-penempatan');
    else if (a === 'unduh-penempatan') { if (S.penempatan) unduhCsv(S.penempatan); }
    else if (a === 'kosongkan-minta') atur({ tanyaKosong: true }, 'kosongkan-tidak');
    else if (a === 'kosongkan-tidak') atur({ tanyaKosong: false }, 'kosongkan-minta');
    else if (a === 'kosongkan-ya') {
      atur({ tanyaKosong: false, pesertaAktif: null, sumberPeserta: '', dimuat: {}, riwayat: [], penempatan: null, penempatanTersimpan: false, kab: null, berkas: null, berkasData: null, langkah: 1 });
      utama.focus({ preventScroll: true });
    }
    else if (a === 'batal-minta') atur({ tanyaBatal: Number(v) }, 'batal-tidak');
    else if (a === 'batal-tidak') atur({ tanyaBatal: null });
    else if (a === 'batal-ya') {
      var dibatalkan = S.riwayat.filter(function (r) { return r.id === Number(v); })[0];
      if (dibatalkan && dibatalkan.kunci === 'peserta') { S.pesertaAktif = null; S.sumberPeserta = ''; S.penempatan = null; S.penempatanTersimpan = false; }
      else if (dibatalkan) delete S.dimuat[dibatalkan.kunci];
      atur({
        tanyaBatal: null,
        riwayat: S.riwayat.map(function (r) { return r.id === Number(v) ? Object.assign({}, r, { status: 'Dibatalkan' }) : r; })
      });
      utama.focus({ preventScroll: true });
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'angkatan') atur({ angkatan: t.value });
    else if (t.id === 'lewati') atur({ lewati: t.checked });
    else if (t.id === 'l-fak') atur({ lFak: t.value });
    else if (t.id === 'l-hanya') atur({ hanyaVerif: t.checked });
    else if (/^kab-(nama|bahasa|bobot)-\d+$/.test(t.id)) {
      var bagian = t.id.split('-'), baris = S.kab[Number(bagian[2])];
      if (!baris) return;
      if (bagian[1] === 'bobot') { var b = Math.round(Number(t.value)); baris.bobot = isNaN(b) ? 1 : Math.max(1, Math.min(100000, b)); }
      else if (bagian[1] === 'nama') baris.nama = t.value.replace(/\s+/g, ' ').trim();
      else baris.bahasa = t.value;
      atur({ penempatan: null, penempatanTersimpan: false });
    }
    else if (t.id === 'angkatan-sql') atur({ angkatanSql: t.value.trim() }, t.closest('.baris').querySelector('[data-a]').getAttribute('data-a'));
    else if (t.id === 'isiposko') {
      var isi = Math.round(Number(t.value));
      atur({ isiPosko: isNaN(isi) ? 10 : Math.max(2, Math.min(100, isi)), penempatan: null, penempatanTersimpan: false });
    }
    else if (t.id === 'nposko' || t.id === 'nbugis' || t.id === 'nmakassar') {
      var bulat = function (v, min, maks) { v = Math.round(Number(v)); return isNaN(v) ? min : Math.max(min, Math.min(maks, v)); };
      var np = t.id === 'nposko' ? bulat(t.value, 1, Math.min(500, dataPeserta().length)) : S.nPosko;
      var nb = bulat(t.id === 'nbugis' ? t.value : S.nBugis, 0, np);
      var nm = bulat(t.id === 'nmakassar' ? t.value : S.nMakassar, 0, np);
      // Jumlah posko berbahasa daerah tidak boleh melebihi jumlah posko.
      if (nb + nm > np) { if (t.id === 'nmakassar') nb = np - nm; else nm = np - nb; }
      atur({ nPosko: np, nBugis: nb, nMakassar: nm, penempatan: null, penempatanTersimpan: false });
    }
    else if (/^a-(bahasa|prodi|jk|fak)$/.test(t.id)) {
      var aturan = { bahasa: S.aturan.bahasa, prodi: S.aturan.prodi, jk: S.aturan.jk, fak: S.aturan.fak };
      aturan[t.id.slice(2)] = t.checked;
      atur({ aturan: aturan, penempatan: null, penempatanTersimpan: false });
    }
    else if (t.id === 'berkas' && t.files && t.files[0]) {
      var f = t.files[0], jenis = S.jenis;
      f.arrayBuffer().then(function (buf) {
        if (/\.csv$/i.test(f.name)) return bacaCsv(new TextDecoder('utf-8').decode(buf));
        if (/\.xlsx$/i.test(f.name)) return bacaXlsx(buf, IMPOR[jenis].nama);
        throw new Error('Jenis berkas tidak didukung. Pakai .xlsx atau .csv.');
      }).then(function (tabel) {
        if (S.jenis !== jenis) return;
        atur({ berkas: f.name, berkasData: OLAH[jenis](tabel), galatBerkas: '', saring: 'semua', lewati: false }, 'langkah:2');
      }).catch(function (e) {
        atur({ berkas: null, berkasData: null, galatBerkas: 'Berkas ' + f.name + ' tidak dapat dibaca. ' + (e && e.message ? e.message : e) });
      });
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'l-cari') atur({ lCari: t.value });
    else if (t.id === 'alasan') S.alasan = t.value;
    else if (t.id === 'l-kunci') S.kunciDraft = t.value;
    else if (t.id === 'l-alamat') S.alamatDraft = t.value;
  });

  // Berkas dapat ditarik ke zona unggah.
  function zona(e) { return e.target && e.target.closest ? e.target.closest('#zona') : null; }
  document.addEventListener('dragover', function (e) { var z = zona(e); if (!z) return; e.preventDefault(); z.classList.add('seret'); });
  document.addEventListener('dragleave', function (e) { var z = zona(e); if (z && !z.contains(e.relatedTarget)) z.classList.remove('seret'); });
  document.addEventListener('drop', function (e) {
    var z = zona(e), inp = document.getElementById('berkas');
    if (!z || !inp) return;
    e.preventDefault(); z.classList.remove('seret');
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    inp.files = e.dataTransfer.files;
    inp.dispatchEvent(new Event('change', { bubbles: true }));
  });

  muat();
  render();
  cekPendaftar();
  setInterval(function () { if (document.visibilityState !== 'hidden') cekPendaftar(); }, JEDA_CEK);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') cekPendaftar(); });
})();
</script>
